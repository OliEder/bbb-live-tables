name: CI (Lint, Static Analysis, Tests)

on:
  push:
  pull_request:

jobs:
  qa:
    name: PHPCS / PHPStan / PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies (PHPCS + WPCS + PHPStan + PHPUnit)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify installed coding standards
        run: vendor/bin/phpcs -i

      - name: Run PHPCS (WordPress Coding Standards)
        run: composer run lint

      - name: Run PHPStan (static analysis)
        run: composer run analyze

      - name: Run PHPUnit (unit tests)
        run: composer run test
